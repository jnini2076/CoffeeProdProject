<app-header></app-header>
<div class="bg-amber-50 min-h-[100dvh] flex items-center justify-center">
  <div class="flex min-h-[100dvh] justify-center items-center">
    <div
      class="bg-gray-50 min-h-screen md:min-h-0 w-full max-w-md items-center p-2 flex flex-col rounded-md border border-amber-800"
    >
      <lucide-icon
        [img]="coffee"
        size="34"
        class="text-white bg-amber-500 rounded-full p-0.5 w-fit md:w-[55px] mt-1 md:h-[50px]"
      ></lucide-icon>
      <div class="flex flex-row gap-1 text-xl mt-5">
        <h3 class="font-sans">Jonathan's</h3>
        <h3 class="font-playfair italic text-amber-500">Coffee</h3>
      </div>

      <div class="flex flex-col items-center w-full mt-4">
        <lucide-icon [img]="user" size="46" class="text-red-600 mb-2"></lucide-icon>
        <h3 class="text-3xl font-medium font-serif md:text-2xl flex text-center text-red-600">
          Delete Account
        </h3>
        <h2 class="text-sm mt-1 md:text-lg font-light text-center">
          This action cannot be undone. Please confirm your decision.
        </h2>
      </div>

      <div class="mt-4 flex flex-col items-center w-full">
        <form [formGroup]="Form" (ngSubmit)="submit()">
          <div class="mb-4">
            <h3 class="text-red-600 font-bold mb-3 text-center">
              To delete your account, type "delete" below
            </h3>
          </div>

          <label class="text-black mr-2 flex mb-1 md:text-xl font-medium">Confirmation</label>
          <input
            type="text"
            formControlName="data"
            placeholder="Type delete"
            class="text-black bg-slate-50 bg-opacity-10 rounded-md border w-full p-1 md:text-xl focus:border-red-500 focus:outline-none"
          />

          @if(invalidDelete){
            <p class="text-red-500 text-sm mt-2 text-center">You must type delete correctly to delete your account.</p>
          }

          <button
            type="submit"
            class="text-white rounded-md w-full bg-red-600 flex mt-4 font-bold p-1 justify-center hover:bg-red-700 md:text-xl transition-colors"
          >
            Confirm Deletion
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
